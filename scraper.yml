name: Autogespot Scraper

on:
  schedule:
    - cron: '*/10 * * * *'  # Führt den Bot alle 10 Minuten aus
  workflow_dispatch:        # Ermöglicht manuelles Ausführen per Button

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Scraper ausführen
        run: python scraper.py

      - name: Änderungen speichern (Git Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add spots.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Update: Neue Spots hinzugefügt" && git push)
          
