<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autogespot Live Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
    #map { height: 100vh; width: 100vw; }
    .popup-img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-top: 8px; }
    .spot-link { display: inline-block; margin-top: 6px; font-weight: bold; color: #007bff; text-decoration: none; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Karte erstellen und auf Europa / Deutschland zentrieren
    const map = L.map('map').setView([51.1657, 10.4515], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const geoCache = {};

    // Wandelt den Ortsnamen in GPS-Koordinaten um
    async function getCoordinates(locationName) {
      if (geoCache[locationName]) return geoCache[locationName];

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(locationName)}`);
        const data = await response.json();
        if (data && data.length > 0) {
          const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
          geoCache[locationName] = coords;
          return coords;
        }
      } catch (e) {
        console.error("Geocoding Fehler:", e);
      }
      return null;
    }

    // Lädt die gespeicherten Spots aus der spots.json
    async function loadSpots() {
      try {
        const response = await fetch('spots.json?v=' + new Date().getTime());
        if (!response.ok) return;

        const spots = await response.json();

        for (const spot of spots) {
          const coords = await getCoordinates(spot.location);
          if (coords) {
            const popupContent = `
              <div style="max-width: 200px;">
                <b style="font-size: 14px;">${spot.title}</b><br>
                📍 <i>${spot.location}</i><br>
                <small style="color: #666;">${spot.time}</small><br>
                ${spot.image ? `<img src="${spot.image}" class="popup-img"><br>` : ''}
                <a href="${spot.url}" target="_blank" class="spot-link">Auf Autogespot ansehen ↗</a>
              </div>
            `;
            L.marker(coords).addTo(map).bindPopup(popupContent);
          }
        }
      } catch (e) {
        console.error("Fehler beim Laden der Karte:", e);
      }
    }

    loadSpots();
  </script>
</body>
</html>
